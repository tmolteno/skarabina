[project]
name = "skarabina"
version = "1.0.4"
description = "Skarabina (dungbeetle): An all purpose 1GC flagger"
authors = [
    { name = "Tim Molteno", email = "tim@elec.ac.nz" }
]
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # The tmolteno/dask-ms fork: supports the casacure backend
    # (DASK_MS_BACKEND=casacure), selected automatically by skarabina's
    # __init__ when casacure is installed.
    "dask-ms[xarray,zarr] @ git+https://github.com/tmolteno/dask-ms.git",
    "zarr>=2.0",
    "angle-parser>=0.1.0",
]

[project.scripts]
skarabina = "skarabina.main:main"
skarabina-analyze = "skarabina.analyze:main"

[project.optional-dependencies]
# casacure: the pure-Rust drop-in replacement for casacore, used as dask-ms's
# I/O backend when installed (skarabina's __init__ aliases casacore -> casacure).
casacure = ["casacure"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "flake8>=7.0",
    # The schema/contract tests (tests/test_analyze_contract.py,
    # cargo/tests/test_schema.py) load the stimela cab definitions, so the
    # cargo package must be importable in the dev environment.
    "skarabina-cargo",
]

[tool.uv.sources]
skarabina-cargo = { path = "cargo", editable = true }
dask-ms = { git = "https://github.com/tmolteno/dask-ms.git" }

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:scabha.*",
]
