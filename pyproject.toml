[project]
name = "skarabina"
version = "1.0.7"
description = "Skarabina (dungbeetle): An all purpose 1GC flagger"
authors = [
    { name = "Tim Molteno", email = "tim@elec.ac.nz" }
]
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dask-ms[casacure,xarray,zarr]",
    "zarr>=2.0",
    "angle-parser>=0.1.0",
]

[project.scripts]
skarabina = "skarabina.main:main"
skarabina-analyze = "skarabina.analyze:main"

[project.optional-dependencies]
# The pure-Rust drop-in replacement for casacore, used as dask-ms's I/O backend
# when it is installed -- dask-ms's own `casacure` extra is requested above, but
# that extra only exists in the tmolteno/dask-ms fork, so this is the explicit
# way to ask for the Rust backend: pip install skarabina[casacure].  Runs select
# it with DASK_MS_BACKEND=casacure; without casacure installed, dask-ms falls
# back to real python-casacore.
casacure = ["casacure"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "flake8>=7.0",
    # The schema/contract tests (tests/test_analyze_contract.py,
    # cargo/tests/test_schema.py) load the stimela cab definitions, so the
    # cargo package must be importable in the dev environment.
    "skarabina-cargo",
]

[tool.uv.sources]
skarabina-cargo = { path = "cargo", editable = true }
# dask-ms from the upstream git repo (master) with the pure-Rust casacure
# backend selected at runtime via DASK_MS_BACKEND=casacure.
dask-ms = { git = "https://github.com/tmolteno/dask-ms.git" }

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:scabha.*",
]
