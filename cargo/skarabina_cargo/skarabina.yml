_include:
  - genesis/skarabina-cargo-base.yml

cabs:
  skarabina:
    name: skarabina
    info: "skarabina (dung beetle) -- A basic 1GC flagger"
    image:
      _use: vars.skarabina-cargo.images
      name: skarabina
    command: skarabina
    inputs:
      ms:
        dtype: MS
        info: The input measurement set
        required: true
      scan:
        dtype: Union[str, None]
        info: >-
          Keep only these scans: a comma-separated list of scan numbers and
          inclusive lo~hi ranges (e.g. "1,12,14" or "0~5"). Filtering happens
          at read time, so flagging, averaging and optimization all apply to
          the selected scans only. Default (or an empty value) is all scans.
      split:
        dtype: Union[str, None]
        info: >-
          When writing the output MS, keep only this field's rows (a field
          name or a numeric FIELD_ID). Applied at save time, after flagging,
          averaging and optimization.
      summary:
        dtype: bool
        info: Print the flagging summary
      optimize:
        dtype: bool
        info: Optimize the size of the measurement set while keeping all rows of equal length.
      keep-fully-flagged-channels:
        dtype: bool
        info: >-
          With optimize, keep channels whose visibilities are all flagged
          instead of removing them. Flagging already excludes them from
          imaging, so keeping them only costs file size -- but removing one
          from the middle of the band leaves a hole that SPECTRAL_WINDOW cannot
          record, so keeping them is the safer choice when the output feeds
          other tools.
      time-average-factor:
        dtype: int
        info: Combine every N consecutive rows by averaging UVW and visibility data. Must run before optimize.
        default: 1
      frequency-average-factor:
        dtype: int
        info: Combine every N consecutive frequency channels by averaging. Flagged data is excluded from the average.
        default: 1
      clobber:
        dtype: bool
        info: Replace the output measurement set
      write-changed-only:
        dtype: bool
        info: >-
          With msout, share the input's unchanged column blocks with the output
          and write only the columns that changed, instead of copying every
          column. Avoids re-reading and rewriting the whole MS for a flagging
          run. Requires the same row and channel shape as the input, and the
          same filesystem for the sharing to take effect; apply is still
          cheaper when the input may be modified.
      barber:
        dtype: bool
        info: Perform barber flagging (removes fringes in a jiffy)
      barber.pol:
        dtype: int
        info: Polarization selection for barber.
      apply:
        dtype: bool
      flag:
        dtype: List[str]
        info: >-
          Flagging operations, in the order they should run. Each entry is
          'verb [args]': autos, uv-above <metres>, nan, clip <lo> <hi>,
          tfcrop [key=value ...], rflag [key=value ...],
          spectral-window <rules.yml>, or the markers save:<name> /
          restore:<name>. Commas inside brackets are not separators, so
          'spectral-window' takes a file and the auto-flaggers' parameters can be
          written as a bracketed list. The list is the run: an operation not
          listed does not run. Both auto-flaggers take CASA's flagdata
          parameters, so a CASA recipe transfers unchanged: tfcrop
          (timecutoff, freqcutoff, timefit, freqfit, maxnpieces, flagdimension,
          usewindowstats, halfwin, combinescans) and rflag (winsize, timedev,
          freqdev, timedevscale, freqdevscale, spectralmax, spectralmin). See
          doc/NEW_FLAGGING.md in the skarabina distribution.
        required: true
        # scabha refuses a list-typed input with no repeat policy, so without
        # this the cab cannot be used at all.  "repeat" matches the CLI, which
        # takes --flag once per entry (and accepts a comma-separated run in any
        # one of them).
        policies:
          repeat: repeat
      flag-file:
        dtype: List[File]
        info: >-
          Read flagging operations from a file: a YAML list, or one entry per
          line with '#' comments. Runs before the entries in 'flag'. May be
          given more than once; the files are read in order.
        policies:
          repeat: repeat
      # field:
      #     dtype: List[int]
      #     info: Use this FIELD_ID from the measurement set
      debug:
        info: Switch on debugging output
        dtype: bool
      field-of-view:
        dtype: str
        info: >-
          Field-of-view FULL width (value with unit: deg, arcmin, arcsec, rad).
          Same convention as skarabina-analyze image-fov; the distance from the
          phase centre to the edge is half of it. Only affects the
          fringe-rotation integration-time limit reported by summary.
        default: "1.0 deg"
      memory-limit-GB:
        dtype: float
        info: >-
          Memory the chunked phases (reading, flagging, averaging, writing)
          may plan for, in GB; sets the row chunk when row-chunk is not given.
          0 = the RAM available now (MemAvailable, capped by a container
          limit). save:<name> is not governed by it.
        default: 0
      row-chunk:
        dtype: Union[int, None]
        info: >-
          Rows per dask chunk. Default: the largest chunk that fits
          memory-limit-GB with the given workers.
      workers:
        dtype: int
        info: >-
          Number of dask threads (0 = all CPU cores). Each holds about one
          row chunk at a time.
        default: 0
    outputs:
      msout:
        dtype: MS
        info: The output measurement set
        required: false

  skarabina-analyze:
    name: skarabina-analyze
    info: "skarabina-analyze -- recommend an image size for synthesis imaging"
    image:
      _use: vars.skarabina-cargo.images
      name: skarabina
    command: skarabina-analyze
    inputs:
      ms:
        dtype: MS
        info: The input measurement set
        required: true
      image-fov:
        dtype: str
        info: >-
          Image field-of-view, FULL width (value with unit: deg, arcmin,
          arcsec, rad). Same convention as the skarabina cab field-of-view.
        required: true
      oversampling-factor:
        dtype: float
        info: Pixels per resolution element (synthesised beam)
        default: 5.0
      json-stdout:
        dtype: bool
        info: >-
          Emit the analysis results as a single JSON line on stdout, which
          stimela wrangles into this cab's scalar outputs. Setting this true
          (or output-json) is what makes the recommended image size available
          to downstream imaging steps.
    outputs:
      # Named file output: stimela supplies the path and passes it as
      # --output-json <path>.  Consume it downstream as
      # =steps.<step>.output-json to read the full analysis record.
      output-json:
        dtype: File
        info: Full analysis results as a JSON file
      # Value outputs, wrangled out of the --json-stdout line.  These are the
      # names a larger pipeline binds to, e.g. =steps.analyze.resolution_arcsec.
      # NB: names must be valid Python identifiers (PARSE_JSON_OUTPUT_DICT
      # cannot assign a key such as "image-size").
      recommended_image_size_pixels:
        dtype: int
        info: Recommended square image size, in pixels
      resolution_arcsec:
        dtype: float
        info: Synthesised beam (angular resolution), in arcsec
      max_baseline_m:
        dtype: float
        info: Longest baseline (maximum uv distance), in metres
      max_frequency_hz:
        dtype: float
        info: Highest channel frequency, in Hz
      min_frequency_hz:
        dtype: float
        info: Lowest channel frequency, in Hz
      bandwidth_hz:
        dtype: float
        info: >-
          Spectrum recorded, in Hz: the sum of the channel widths. Equals
          span_hz plus half a channel at each end for a contiguous band.
      span_hz:
        dtype: float
        info: >-
          Highest minus lowest channel frequency, in Hz. Includes any hole left
          by removed channels.
      channel_width_hz:
        dtype: float
        info: >-
          Width of one channel, in Hz, read from the subtable (CHAN_WIDTH or
          RESOLUTION) rather than derived from the band span.
      band_has_gaps:
        dtype: bool
        info: >-
          True when the channels are not contiguous: a hole left by removed
          channels, or more than one spectral window.
      num_channels:
        dtype: int
        info: Number of channels per spectral window
      max_channel_width_hz:
        dtype: float
        info: >-
          Widest channel that keeps white-light fringes coherent at the edge of
          the field of view, in Hz
      min_channels:
        dtype: int
        info: >-
          Fewest channels the data supports at that field edge (bandwidth
          divided by max_channel_width_hz)
      max_integration_time_s:
        dtype: float
        info: >-
          Longest integration that keeps time-average smearing at the field
          edge below ~10%, in seconds (TMS p.246)
      bandwidth_smearing_factor:
        dtype: float
        info: >-
          Radial bandwidth-smearing factor R_b for the channels as they are,
          before any averaging
    management:
      wranglers:
        # The single-line JSON emitted by --json-stdout.  PARSE_JSON_OUTPUT_DICT
        # parses the first ()-group and assigns its keys to outputs of the same
        # name.  Do not add a trailing "$" here: stimela applies this pattern
        # per output line, and anchoring it interacts badly with the rich
        # markup it wraps around lines.
        'SKARABINA_ANALYZE_JSON (.*)':
          - PARSE_JSON_OUTPUT_DICT
